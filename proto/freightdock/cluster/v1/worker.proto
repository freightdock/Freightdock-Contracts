// The contract between a worker-agent and the manager-agents.
//
// A worker dials a manager (any manager: it never needs to know which one leads), enrols once with a join token for a
// client certificate from the cluster CA, and from then on keeps one long-lived Open stream open. Everything after
// enrolment goes over that stream: the worker's hello, its heartbeats, and its reports on commands; the manager's
// welcome, its commands and its acknowledgements.
//
// Versioning: this is v1. Fields are only ever added (new numbers), never renumbered or reused; a breaking change is a
// new package, freightdock.cluster.v2, served beside v1 for as long as old workers run.

syntax = "proto3";

package freightdock.cluster.v1;

// ---------------------------------------------------------------------------------------------------------------------
// Enrolment. Served over TLS with no client certificate; the worker checks the manager's chain against the CA whose
// fingerprint its join token pins, so the token's secret goes to no other server.

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // The whole join token, FDCT1-<ca sha256>-<secret>.
  string join_token = 1;
  // A PKCS#10 certificate request, PEM. Only its public key is used; the manager sets the name, usage and dates.
  string csr_pem = 2;
  // The worker's own UUID, made on its first start and kept.
  string node_id = 3;
  string hostname = 4;
}

message EnrollResponse {
  // The worker's client certificate, PEM, naming node_id.
  string cert_pem = 1;
  // The cluster CA, PEM. Its SHA-256 must be the one the token pins.
  string ca_pem = 2;
  string cluster_id = 3;
  // Every manager endpoint known at enrolment (host:port), so the worker can fail over from its first day.
  repeated string managers = 4;
}

// ---------------------------------------------------------------------------------------------------------------------
// The session. Mutual TLS: the client certificate names the node, and the manager believes nothing else about who it is.

service WorkerSession {
  // One per worker per manager, kept open. The worker's first message is a Hello; the manager's first is a Welcome.
  rpc Open(stream WorkerMessage) returns (stream ManagerMessage);
}

message WorkerMessage {
  oneof body {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandUpdate command_update = 3;
  }
}

message ManagerMessage {
  oneof body {
    Welcome welcome = 1;
    Command command = 2;
    HeartbeatAck heartbeat_ack = 3;
    Authorize authorize = 4;
    NetworkState network = 5;
  }
}

message Hello {
  // Must match the certificate's node id, or the stream is refused.
  string node_id = 1;
  string hostname = 2;
  string agent_version = 3;
  // The kernel's boot id (/proc/sys/kernel/random/boot_id): a new one means the worker rebooted since it last spoke.
  string boot_id = 4;
  FencingState fencing_state = 5;
  map<string, string> labels = 6;
  NodeResources resources = 7;
  Capabilities capabilities = 8;
  // Command ids the worker has seen and not finished, so a manager that took over can tell what is in flight.
  repeated string in_flight = 9;
  // The managed containers on the node now. Absent when the worker could not ask its Docker.
  WorkloadReport workloads = 10;
  // The node's overlay (G9). Absent from a worker without one.
  NetworkReport network = 11;
}

message Welcome {
  string cluster_id = 1;
  string manager_id = 2;
  // How often the worker should send a heartbeat.
  uint32 heartbeat_interval_ms = 3;
  // Every manager endpoint the cluster knows now; the worker keeps this list for its next dial.
  repeated string managers = 4;
  // The cluster's self-fencing timers (G6), in seconds: after `fence_stop_s` without any manager the worker stops its
  // managed workloads and fences; `fence_storage_s` later it stops shared-storage writes; `fence_reboot_s` after that
  // it reboots if it could not stop them. 0: the worker keeps what it has.
  uint32 fence_stop_s = 5;
  uint32 fence_storage_s = 6;
  uint32 fence_reboot_s = 7;
}

// The managers let a fenced worker run managed workloads again (plan 7.4). Until it has this, a fenced worker runs
// none, whatever it is told.
message Authorize {
  // Who decided, for the worker's log.
  string by = 1;
}

message Heartbeat {
  // Counts up from 1 on each stream.
  uint64 seq = 1;
  // The worker's wall clock, unix milliseconds; for diagnostics only, never for liveness.
  int64 sent_at_ms = 2;
  NodeResources resources = 3;
  // The managed containers on the node, read as the heartbeat was made. Absent when the worker could not ask its Docker.
  WorkloadReport workloads = 4;
  FencingState fencing_state = 5;
  NetworkReport network = 6;
}

// What runs on a worker for the cluster: every container labelled as managed, whatever its state. The manager compares
// it with what should run there (G4 reconcile) and sends commands for the difference.
message WorkloadReport {
  repeated WorkloadState workloads = 1;
}

message WorkloadState {
  string workload_id = 1;
  string container_id = 2;
  // Docker's word for it: created, running, paused, restarting, removing, exited, dead.
  string state = 3;
  // The workload generation the container was made for (RunContainer.generation); 0 for one made without.
  uint64 generation = 4;
  // The exit code, once it has exited.
  int32 exit_code = 5;
  string image = 6;
}

// The node's side of the overlay (G9): its WireGuard key, made on the node (the private key never leaves it), and how
// far it got with the managers' network state.
message NetworkReport {
  string public_key = 1;
  uint32 listen_port = 2;
  // The NetworkState.version applied, all of it; 0 for none yet.
  uint64 applied_version = 3;
  // Why the last state could not be applied, if it could not.
  string error = 4;
}

// The network a node should have (G9), whole each time: the worker makes it so and removes what is not in it. Sent
// when it changes and at every new stream; an older version than the one applied is ignored.
message NetworkState {
  uint64 version = 1;
  // The cluster's internal range, as 10.240.0.0/16: the routes and the filters stay inside it.
  string cluster_range = 2;
  uint32 mtu = 3;
  // Every other node with an overlay.
  repeated NetworkPeer peers = 4;
  // The stack networks this node needs: those with a workload placed on it.
  repeated StackNetwork stacks = 5;
}

message NetworkPeer {
  string node_id = 1;
  string public_key = 2;
  // host:port of its WireGuard, as the managers see the node.
  string endpoint = 3;
  // The workload addresses on that node (/32): routed to it.
  repeated string addresses = 4;
}

// A stack's network: a bridge on every node that runs a part of it, all with the same subnet; its workloads talk to
// each other and to nothing else in the cluster range.
message StackNetwork {
  string stack = 1;
  // As 10.240.3.0/24.
  string subnet = 2;
  // The bridge's own address, as 10.240.3.1.
  string gateway = 3;
}

message HeartbeatAck {
  uint64 seq = 1;
}

message NodeResources {
  uint32 cpu_count = 1;
  // 0..100 over all CPUs.
  float cpu_percent = 2;
  uint64 memory_total_bytes = 3;
  uint64 memory_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint64 disk_used_bytes = 6;
  uint32 containers_running = 7;
}

message Capabilities {
  bool docker = 1;
  string docker_version = 2;
  string os = 3;
  string arch = 4;
  string kernel = 5;
}

enum FencingState {
  FENCING_STATE_UNSPECIFIED = 0;
  // Running normally.
  FENCING_STATE_NONE = 1;
  // Fenced itself (stopped managed workloads, maybe rebooted) and waits for the managers to authorize it again.
  FENCING_STATE_AWAITING_AUTHORIZATION = 2;
}

// ---------------------------------------------------------------------------------------------------------------------
// Commands. A command is idempotent by its id: a worker that sees an id again (a resend after a reconnect, another
// manager's copy) reports the state it already has and does not run it twice.

message Command {
  string command_id = 1;
  // The node it is for; a worker refuses a command addressed to another node.
  string node_id = 2;
  // The cluster configuration version it was made against.
  uint64 config_version = 3;
  // Unix milliseconds after which the worker must not start it (it reports EXPIRED instead).
  int64 deadline_ms = 4;
  oneof op {
    Ping ping = 10;
    DockerInfo docker_info = 11;
    RunContainer run_container = 12;
    StopContainer stop_container = 13;
    RemoveContainer remove_container = 14;
  }
}

// Does nothing; proves the round trip.
message Ping {}

// Answers the worker's Docker version and container counts.
message DockerInfo {}

// Starts one container for a workload. The container is labelled with the workload id so the worker can find it again;
// its restart policy is always "no", as a managed workload is restarted by the cluster, never by Docker on its own.
// A container for the workload that is already there is started if stopped, and made again if it was made for another
// generation (the workload's spec changed).
message RunContainer {
  string workload_id = 1;
  string image = 2;
  string name = 3;
  repeated string command = 4;
  map<string, string> env = 5;
  map<string, string> labels = 6;
  // Counts up each time the workload's spec changes; kept on the container as a label.
  uint64 generation = 7;
  repeated PortMapping ports = 8;
  // Docker's form: source:target or source:target:ro, the source a named volume or an absolute host path.
  repeated string volumes = 9;
  // What the container may use at most: thousandths of a CPU and bytes of memory; 0 is no limit.
  uint64 cpu_millis = 10;
  uint64 memory_bytes = 11;
  // On the overlay (G9): the stack whose network the container joins, its fixed address there, and the names of the
  // stack's services, each "name:address". Empty stack: Docker's default network, as before.
  string network_stack = 12;
  string address = 13;
  repeated string hosts = 14;
}

message PortMapping {
  uint32 host_port = 1;
  uint32 container_port = 2;
  // tcp or udp; tcp when empty.
  string protocol = 3;
  // The host address to bind; all when empty.
  string host_ip = 4;
}

message StopContainer {
  string workload_id = 1;
  uint32 timeout_s = 2;
}

message RemoveContainer {
  string workload_id = 1;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  // The manager has recorded it; not yet delivered.
  COMMAND_STATUS_PENDING = 1;
  // The worker has it. Says nothing about whether it will run.
  COMMAND_STATUS_RECEIVED = 2;
  // The worker checked it and is running it.
  COMMAND_STATUS_ACCEPTED = 3;
  COMMAND_STATUS_SUCCEEDED = 4;
  COMMAND_STATUS_FAILED = 5;
  // The worker would not run it (another node's, unknown op, fenced).
  COMMAND_STATUS_REJECTED = 6;
  // Its deadline passed before it started.
  COMMAND_STATUS_EXPIRED = 7;
}

message CommandUpdate {
  string command_id = 1;
  CommandStatus status = 2;
  // A person-readable line: why it failed, what it did.
  string message = 3;
  // The op's answer as JSON, for those that have one (DockerInfo, RunContainer's container id).
  string result_json = 4;
}
